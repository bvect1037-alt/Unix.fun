<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0.01">

  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden !important;
      scrollbar-width: none !important; -ms-overflow-style: none !important;
      background: #030305; color: #ff2a6d; font-family: 'Consolas', monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; user-select: none;
    }
    .badge {
      padding: 10px 24px; border-radius: 9999px; background: rgba(255, 42, 109, 0.15);
      border: 1px solid #ff2a6d; color: #ff2a6d; font-size: 13px; font-weight: bold; letter-spacing: 2px; margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.4);
    }
    h1 { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 8px; text-shadow: 0 0 12px rgba(255, 42, 109, 0.8); }
    p { font-size: 13.5px; color: #00ffcc; margin-bottom: 12px; }
    .status { font-size: 12px; color: #888899; }
  </style>
</head>
<body>
  <div class="badge">⛔ ACCESS DENIED - SKID DETECTED</div>
  <h1>--Anti Skid by Khfresh--</h1>
  <p>⚡ Auto-Reloading 0.01s | Scrollbar Locked | Inspection Blocked</p>
  <div class="status">🔒 Direct browser access prohibited. Execute via Roblox Loadstring only!</div>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i'))) e.preventDefault();
    });
    setTimeout(() => { window.location.reload(true); }, 10);
  </script>
