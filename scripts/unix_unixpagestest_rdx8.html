<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0.01">
  <title>⛔ ACCESS DENIED - Protected by Unix.fun Lua Protection</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden !important;
      scrollbar-width: none !important; -ms-overflow-style: none !important;
      background: #030305; color: #ff2a6d; font-family: 'Consolas', 'Courier New', monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; user-select: none;
    }
    body::-webkit-scrollbar, html::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    .badge {
      padding: 10px 24px; border-radius: 9999px; background: rgba(255, 42, 109, 0.15);
      border: 1px solid #ff2a6d; color: #ff2a6d; font-size: 13px; font-weight: bold; letter-spacing: 2px; margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.4); animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.8; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }
    h1 { font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 6px; text-shadow: 0 0 12px rgba(255, 42, 109, 0.8); }
    .subtitle { font-size: 14px; font-weight: 600; color: #00ffcc; margin-bottom: 12px; }
    p { font-size: 13px; color: #888899; margin-bottom: 14px; }
    .status { font-size: 12px; color: #ff2a6d; background: rgba(255, 42, 109, 0.1); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255, 42, 109, 0.3); }
  </style>
</head>
<body>
  <div class="badge">⛔ ACCESS DENIED - SKID DETECTED</div>
  <h1>--Anti Skid by Khfresh--</h1>
  <div class="subtitle">Protected by Unix.fun Lua Protection</div>
  <p>⚡ Auto-Reloading 0.01s | Scrollbar Locked | Inspection & F12 Blocked</p>
  <div class="status">🔒 Direct web access prohibited. Execute via Roblox Loadstring only!</div>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'U' || e.key === 'S' || e.key === 'I'))) e.preventDefault();
    });
    setTimeout(() => { window.location.reload(true); }, 10);
  </script>
</body>
</html>
